[workspace]
members = ["crates/fossil-core", "crates/fossil-cli", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Fossil Contributors"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
