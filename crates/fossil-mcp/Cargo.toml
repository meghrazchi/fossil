[package]
name = "fossil-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Model Context Protocol (MCP) server library for Fossil disk usage analyzer"

[dependencies]
fossil-core = { path = "../fossil-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
fastrand = "2"
toml_edit = { version = "0.22", optional = true }
tiny_http = { version = "0.12", optional = true }

[dev-dependencies]
tempfile = "3.20"

[features]
default = ["http", "config"]
http = ["dep:tiny_http"]
config = ["dep:toml_edit"]

[lints]
workspace = true
