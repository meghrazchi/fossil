[package]
name = "fossil-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Standalone CLI and stdio MCP server for Fossil disk usage analyzer"

[[bin]]
name = "fossil"
path = "src/main.rs"

[dependencies]
fossil-core = { path = "../fossil-core" }
fossil-mcp = { path = "../fossil-mcp" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.20"

[lints]
workspace = true
